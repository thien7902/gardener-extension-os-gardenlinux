image:
  repository: registry.fke.fptcloud.com/762c8029-26d9-4bea-b461-989ee4d4890f/os-gardenlinux
  tag: latest
  pullPolicy: IfNotPresent

# names of secrets of type kubernetes.io/dockerconfigjson used for pulling the image from a private registry
imagePullSecrets:
- regcred

resources: {}

vpa:
  enabled: true
  resourcePolicy:
    minAllowed:
      memory: 64Mi
  updatePolicy:
    updateMode: "InPlaceOrRecreate"

controllers:
  concurrentSyncs: 5
  ignoreOperationAnnotation: false
  heartbeat:
    renewIntervalSeconds: 30

disableControllers: []

gardener:
  version: ""
  gardenlet:
    featureGates: {}

# settings for metrics, e.g. scraping by seed-prometheus
metrics:
  # enable metrics scraping
  enableScraping: true
  port: 8080

webhookConfig:
  servicePort: 443
  serverPort: 10250
